name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y fonts-liberation ffmpeg
      - run: npm ci
      - run: npm run check
      - run: npm run build
